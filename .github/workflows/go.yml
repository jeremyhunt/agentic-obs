name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      # The scripting channel lives behind -tags scripting, so nothing above
      # compiles it. A rename in Server, recordAction or bridge.Transport would
      # break that build while CI stayed green, and the breakage would only
      # show up on the private branch that actually uses it.
      - name: Build with the scripting tag
        run: go build -tags scripting ./...

      - name: Run go vet
        run: go vet ./...

      # vet compiles test files too, so this also guards the build-tagged
      # tests -- including internal/bridge's obslive suite, which is the only
      # verification the bridge's Lua gets and which nothing else here builds.
      - name: Run go vet with the build tags
        run: |
          go vet -tags scripting ./...
          go vet -tags obslive ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            exit 1
          fi

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      # The tagged tests are invisible to the run above. AGENTIC_OBS_SCRIPTING
      # is deliberately NOT set: the tool's own tests cover both states, and
      # setting it here would make every other test run against a server that
      # serves run_lua_in_obs.
      - name: Run tests with the scripting tag
        run: go test -race -tags scripting ./...

      # Tool counts and help entries live in Go source, so a Go-only change can
      # break documentation consistency without touching a .md file. docs-check
      # only triggers on markdown paths, so it would never see it. (FB-52)
      - name: Verify documentation consistency
        run: ./scripts/verify-docs.sh

      - name: Verify skills
        run: ./scripts/verify-skills.sh

      - name: Display coverage
        run: go tool cover -func=coverage.out
