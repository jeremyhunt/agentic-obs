name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            exit 1
          fi

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      # Tool counts and help entries live in Go source, so a Go-only change can
      # break documentation consistency without touching a .md file. docs-check
      # only triggers on markdown paths, so it would never see it. (FB-52)
      - name: Verify documentation consistency
        run: ./scripts/verify-docs.sh

      - name: Verify skills
        run: ./scripts/verify-skills.sh

      - name: Display coverage
        run: go tool cover -func=coverage.out
